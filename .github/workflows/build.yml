name: Build & Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: "Currency Converter"

jobs:
  build:
    name: Build — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Compile with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --enable-plugin=pyside6 \
            --output-dir=dist \
            --output-filename=CurrencyConverter \
            --macos-app-name="Currency Converter" \
            --macos-app-version=${{ github.ref_name }} \
            --macos-app-icon=assets/icon.icns \
            --include-data-files=currencies.yaml=currencies.yaml \
            --assume-yes-for-downloads \
            main.py

      - name: Rename & sign app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          # Nuitka names the bundle after the script — normalise to our app name
          SRC="dist/CurrencyConverter.app"
          [ -d "$SRC" ] || SRC="dist/main.app"
          mv "$SRC" "dist/Currency Converter.app"
          # Ad-hoc sign so macOS accepts the bundle structure
          codesign --deep --force --sign - "dist/Currency Converter.app"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          hdiutil create \
            -volname "Currency Converter" \
            -srcfolder "dist/Currency Converter.app" \
            -ov -format UDZO \
            "CurrencyConverter-macOS-${{ github.ref_name }}.dmg"

      # ── Windows ────────────────────────────────────────────────────────────
      - name: Compile with Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --output-dir=dist `
            --output-filename=CurrencyConverter `
            --windows-icon-from-ico=assets/icon.ico `
            --include-data-files=currencies.yaml=currencies.yaml `
            --assume-yes-for-downloads `
            main.py

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\CurrencyConverter.exe" -DestinationPath "CurrencyConverter-Windows-${{ github.ref_name }}.zip"

      # ── release ────────────────────────────────────────────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Currency Converter ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            CurrencyConverter-macOS-${{ github.ref_name }}.dmg
            CurrencyConverter-Windows-${{ github.ref_name }}.zip
